<svg width="120" height="32" viewBox="0 0 120 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Electric Blue Gradient -->
  <defs>
    <linearGradient id="nidaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Anvil Icon -->
  <g transform="translate(0, 0)">
    <path d="M4 12h16v3H4z" fill="url(#nidaGradient)" filter="url(#glow)"/>
    <path d="M6 15h12v6c0 1-1 2-2 2H8c-1 0-2-1-2-2v-6z" fill="url(#nidaGradient)" filter="url(#glow)"/>
    <path d="M9 9h6v3H9z" fill="url(#nidaGradient)" filter="url(#glow)"/>
    <path d="M12 5l-2 5h3l-2 6 4-7h-3l2-4z" fill="#FFFFFF" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- NIDA Text -->
  <g fill="url(#nidaGradient)" font-family="Inter, sans-serif" font-weight="800" font-size="20" letter-spacing="1">
    <text x="30" y="24">NIDA</text>
  </g>
</svg>
